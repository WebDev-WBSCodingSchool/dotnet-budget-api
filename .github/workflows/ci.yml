name: CI

on:
  push:
    branches: ["main", "step-*"]
  pull_request:
    branches: ["main", "step-*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BudgetApi.slnx

      - name: Build
        run: dotnet build BudgetApi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test BudgetApi.slnx --no-build --configuration Release
